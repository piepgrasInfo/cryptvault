name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Both distributions, always. `:app:test` covers testPlayDebugUnitTest and
      # testFossDebugUnitTest; the flavour tasks are flavoured since the `dist` dimension was
      # added, so there is no testDebugUnitTest or lintDebug to call any more.
      - name: Unit tests
        run: ./gradlew :app:test :shared:jvmTest

      - name: Lint
        run: ./gradlew :app:lintPlayDebug :app:lintFossDebug

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug
