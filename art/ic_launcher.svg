<?xml version="1.0" encoding="UTF-8"?>
<!-- Crypt Vault launcher icon: adaptive-icon architecture on one canvas.

     Canvas    108 x 108   - both layers cover it; the background is full bleed.
     Safe zone  72 x 72    - x/y 18..90; the vault door is a 66dp disc centred in it,
                             which is Android's keyline circle, so the circular and
                             squircle masks both leave the blue rim visible.

     The background gradient is the house one, byte for byte the same as Flip
     Cards' and Work Time Tracker's: #1E88E5 at the top to #0D47A1 at the
     bottom, so the three productivity apps sit together in a launcher.

     Source of truth for the whole icon set: app/src/main/res/mipmap-*, the three
     art/ Play listing assets and the fastlane copies are all generated from this
     file by the app-launcher-icon-creator skill. Edit here, never there.

     The monochrome layer is NOT derived mechanically from the foreground group:
     flattening its four paints to one tint turns the vault door into a plain
     disc. art/ic_launcher_monochrome.svg keeps the dark shapes as cut-outs
     instead, and is regenerated with the generator's keep-monochrome flag. -->
