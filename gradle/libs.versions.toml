[versions]
# AGP 9+ compiles Kotlin itself (built-in Kotlin support), so the
# org.jetbrains.kotlin.android plugin is not applied separately.
agp = "9.3.1"
# The Compose compiler plugin version must match the Kotlin compiler version
# AGP's built-in Kotlin support uses.
kotlinComposeCompiler = "2.4.10"
composeBom = "2026.06.01"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
junit = "4.13.2"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxEspresso = "3.7.0"
# Crash reporting. sentry-android-core only, deliberately not the umbrella
# io.sentry:sentry-android artifact: that pulls in NDK support and session replay.
sentry = "8.53.0"
navigationCompose = "2.8.5"
ktor = "3.0.3"
# OkHttp is what ktor-client-okhttp already pulls in; the WebDAV backup target uses it directly
# (blocking streams suit the RemoteStore interface). Apache-2.0. MockWebServer for its tests.
okhttp = "4.12.0"
# WorkManager: the debounced backup-after-change job and the foreground backup/restore runs
# below API 34 (BUILD_BRIEF.md §6.4). Apache-2.0.
work = "2.11.2"
# Phase 5 mail containers (BUILD_BRIEF.md §7.2), all pure JVM: ZIP AES-256 (zip4j, Apache-2.0),
# age (kage, Apache-2.0), OpenPGP symmetric (PGPainless, Apache-2.0) on Bouncy Castle (MIT-style),
# pinned once so kage and PGPainless share one provider version.
zip4j = "2.11.6"
kage = "0.7.0"
pgpainless = "2.0.4"
bouncycastle = "1.86"
serialization = "1.11.0"
kotlin = "2.4.10"
# The vault format. 2.2.2, never 2.2.1: the official Android app marks 2.2.1 as broken for
# file creation (buildsystem/dependencies.gradle in cryptomator/android). AGPL-3.0, see NOTICE.
cryptolib = "2.2.2"
# Test-only: Cryptomator's own file-system layer, which opens the vaults this app writes -
# the interop check of BUILD_BRIEF.md §12 Phase 0 runs on the JVM. Needs Java 25 at test time.
cryptofs = "2.10.0"
slf4j = "2.0.17"
exifinterface = "1.4.2"
# Password strength for the vault password gate (BUILD_BRIEF.md §4.1). MIT.
zxcvbn = "1.9.0"
# Biometric prompt; the stable line, not the 1.4 alphas (BUILD_BRIEF.md §13).
biometric = "1.1.0"
# Pinned because biometric 1.1.0 drags in fragment 1.2.5, whose FragmentActivity still rejects
# the request codes Compose's activity-result registry generates ("lower 16 bits" crash).
fragment = "1.8.9"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxEspresso" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
sentry-android-core = { group = "io.sentry", name = "sentry-android-core", version.ref = "sentry" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
cryptolib = { group = "org.cryptomator", name = "cryptolib", version.ref = "cryptolib" }
cryptofs = { group = "org.cryptomator", name = "cryptofs", version.ref = "cryptofs" }
slf4j-nop = { group = "org.slf4j", name = "slf4j-nop", version.ref = "slf4j" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
zxcvbn = { group = "com.nulab-inc", name = "zxcvbn", version.ref = "zxcvbn" }
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
fragment = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
zip4j = { group = "net.lingala.zip4j", name = "zip4j", version.ref = "zip4j" }
kage = { group = "com.github.android-password-store", name = "kage", version.ref = "kage" }
pgpainless = { group = "org.pgpainless", name = "pgpainless-core", version.ref = "pgpainless" }
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pg = { group = "org.bouncycastle", name = "bcpg-jdk18on", version.ref = "bouncycastle" }
bouncycastle-util = { group = "org.bouncycastle", name = "bcutil-jdk18on", version.ref = "bouncycastle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinComposeCompiler" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
